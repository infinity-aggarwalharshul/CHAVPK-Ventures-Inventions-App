<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The ChitraHarsha Navasrijan - Pioneering AI-Driven Innovations</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Inter Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide-react@latest/dist/umd/lucide.min.js"></script>

    <!-- Firebase JS SDK -->
    <script type="module">
        // Import Firebase services
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import {
            getAuth,
            signInAnonymously,
            signInWithCustomToken,
            onAuthStateChanged,
            createUserWithEmailAndPassword,
            signInWithEmailAndPassword
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import {
            getFirestore,
            doc,
            getDoc,
            setDoc,
            collection,
            addDoc,
            setLogLevel
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // --- GLOBAL APP STATE ---
        const appState = {
            currentPage: 'home',
            user: null,
            authReady: false,
            isLoading: false,
            geminiChatHistory: [],
            currentRegistrationStep: 1,
            registrationData: {},
            currencyConversion: {
                from: 'USD',
                to: 'INR',
                amount: 1,
                result: '...'
            }
        };

        // --- FIREBASE & APP CONFIG ---
        let app, auth, db;
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
       
        // Use provided Firebase config
        try {
            const firebaseConfig = JSON.parse(typeof __firebase_config !== 'undefined' ? __firebase_config : '{}');
            app = initializeApp(firebaseConfig);
            auth = getAuth(app);
            db = getFirestore(app);
            setLogLevel('Debug');
        } catch (error) {
            console.error("Firebase initialization error:", error);
            renderModal("Initialization Error", "Could not connect to services. Please refresh.");
        }

        // --- AUTHENTICATION ---
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                appState.user = user;
                // Fetch user profile from Firestore
                const userProfile = await getUserProfile(user.uid);
                appState.user = { ...user, ...userProfile };
               
                // Navigate to dashboard after login/registration
                if (appState.currentPage === 'login' || appState.currentPage === 'register') {
                    appState.currentPage = 'dashboard';
                }
            } else {
                appState.user = null;
                // Try custom token or anonymous sign-in
                try {
                    if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                        await signInWithCustomToken(auth, __initial_auth_token);
                    } else {
                        await signInAnonymously(auth);
                        console.log("Signed in anonymously");
                    }
                } catch (error) {
                    console.error("Auth error:", error);
                }
            }
            appState.authReady = true;
            renderApp();
        });

        async function getUserProfile(userId) {
            try {
                const userDocRef = doc(db, `artifacts/${appId}/users/${userId}/profile`, "data");
                const docSnap = await getDoc(userDocRef);
                if (docSnap.exists()) {
                    return docSnap.data();
                } else {
                    console.log("No user profile found, creating one...");
                    // Create a default profile if none exists (e.g., for anonymous user)
                    const defaultProfile = {
                        role: 'guest',
                        displayName: 'Guest User'
                    };
                    await setDoc(userDocRef, defaultProfile);
                    return defaultProfile;
                }
            } catch (error) {
                console.error("Error getting user profile:", error);
                return { role: 'guest', displayName: 'Guest' };
            }
        }

        // --- STYLES & CONFIG ---
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        'brand-dark': '#0a092d',
                        'brand-mid': '#1a184a',
                        'brand-light': '#2b296b',
                        'brand-accent': '#00ffff', // Cyan
                        'brand-glow': '#f000ff',   // Magenta
                    },
                    boxShadow: {
                        'glow-cyan': '0 0 15px 0 rgba(0, 255, 255, 0.5), 0 0 5px 0 rgba(0, 255, 255, 0.7)',
                        'glow-magenta': '0 0 15px 0 rgba(240, 0, 255, 0.5), 0 0 5px 0 rgba(240, 0, 255, 0.7)',
                    },
                    animation: {
                        'pulse-glow': 'pulse-glow 2.5s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'subtle-gradient': 'subtle-gradient 15s ease infinite',
                    },
                    keyframes: {
                        'pulse-glow': {
                            '0%, 100%': { opacity: 1, boxShadow: '0 0 15px 0 rgba(0, 255, 255, 0.5)' },
                            '50%': { opacity: 0.8, boxShadow: '0 0 25px 3px rgba(0, 255, 255, 0.7)' },
                        },
                        'subtle-gradient': {
                            '0%, 100%': { backgroundPosition: '0% 50%' },
                            '50%': { backgroundPosition: '100% 50%' },
                        }
                    },
                    // Add prose configuration for better spacing
                    typography: ({ theme }) => ({
                        invert: {
                            css: {
                                'p': {
                                    marginBottom: theme('spacing.6'), // Adds space after paragraphs
                                },
                                'ul, ol': {
                                    marginBottom: theme('spacing.6'), // Adds space after lists
                                },
                                'h1, h2, h3, h4, h5, h6': {
                                    marginBottom: theme('spacing.4'), // Space after headings
                                    marginTop: theme('spacing.8'), // Space before headings
                                },
                            },
                        },
                    }),
                },
            },
            // Add typography plugin
            plugins: [
                tailwind.plugins.typography,
            ],
        };

        // --- GEMINI API CALL ---
        async function getGeminiResponse(prompt) {
            appState.isLoading = true;
            renderApp();

            const apiKey = ""; // API key is handled by the environment
            const apiUrl = `https://generativelab.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;

            const systemPrompt = "You are Navasrijan AI, an expert assistant for 'The ChitraHarsha Navasrijan', an all-rounder invention industry platform. Your purpose is to help users with brainstorming, research, and development of new inventions. You must adhere to Indian government rules and regulations and promote 'Made in India' innovations. Provide concise, helpful, and grounded information.";

            const payload = {
                contents: [
                    ...appState.geminiChatHistory, // Include past conversation
                    {
                        role: "user",
                        parts: [{ text: prompt }]
                    }
                ],
                systemInstruction: {
                    parts: [{ text: systemPrompt }]
                },
                tools: [{ "google_search": {} }], // Enable Google Search grounding
            };

            try {
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    throw new Error(`API Error: ${response.statusText}`);
                }

                const result = await response.json();
                const candidate = result.candidates?.[0];

                if (candidate && candidate.content?.parts?.[0]?.text) {
                    const text = candidate.content.parts[0].text;
                    const modelResponse = { role: "model", parts: [{ text }] };
                   
                    // Add both user and model responses to history
                    appState.geminiChatHistory.push({ role: "user", parts: [{ text: prompt }] });
                    appState.geminiChatHistory.push(modelResponse);

                    // Extract sources if available
                    let sources = [];
                    const groundingMetadata = candidate.groundingMetadata;
                    if (groundingMetadata && groundingMetadata.groundingAttributions) {
                        sources = groundingMetadata.groundingAttributions
                            .map(attr => ({
                                uri: attr.web?.uri,
                                title: attr.web?.title,
                            }))
                            .filter(s => s.uri && s.title);
                    }
                    return { text, sources };

                } else {
                    throw new Error("Invalid response structure from API.");
                }

            } catch (error) {
                console.error("Gemini API call failed:", error);
                return { text: "My apologies, I'm encountering a technical issue. Please try again in a moment.", sources: [] };
            } finally {
                appState.isLoading = false;
                renderApp();
            }
        }

        // --- NAVIGATION & ROUTING ---
        function navigateTo(page) {
            appState.currentPage = page;
            appState.geminiChatHistory = []; // Clear chat history on page change
            appState.currentRegistrationStep = 1; // Reset registration
            appState.registrationData = {};
            window.scrollTo(0, 0);
            renderApp();
        }

        // --- EVENT HANDLERS ---
        function attachGlobalListeners() {
            document.body.addEventListener('click', (e) => {
                // Navigation links
                const navLink = e.target.closest('[data-nav]');
                if (navLink) {
                    e.preventDefault();
                    navigateTo(navLink.dataset.nav);
                }
               
                // Modal close
                if (e.target.closest('[data-modal-close]')) {
                    document.getElementById('modal-backdrop')?.remove();
                }

                // Guest Mode
                if (e.target.closest('[data-guest-mode]')) {
                    appState.currentPage = 'dashboard';
                    renderApp();
                }

                // Registration
                const regNext = e.target.closest('[data-reg-next]');
                if (regNext) handleRegistrationNext(regNext.dataset.regNext);

                const regPrev = e.target.closest('[data-reg-prev]');
                if (regPrev) handleRegistrationPrev(regPrev.dataset.regPrev);

                // Download Client
                if (e.target.closest('[data-download]')) {
                    handleDownloadClient();
                }

                // Freemium/Pricing
                if (e.target.closest('[data-select-plan]')) {
                    handleSelectPlan(e.target.closest('[data-select-plan]').dataset.selectPlan);
                }

                // Salary Automation
                if (e.target.closest('#salary-toggle')) {
                    const toggle = e.target.closest('#salary-toggle');
                    const enabled = toggle.getAttribute('aria-checked') === 'true';
                    toggle.setAttribute('aria-checked', !enabled);
                    toggle.querySelector('span').classList.toggle('translate-x-5');
                    toggle.classList.toggle('bg-brand-accent');
                    toggle.classList.toggle('bg-gray-600');
                    renderModal("Salary Automation", `AI-driven salary payment has been ${!enabled ? 'ENABLED' : 'DISABLED'}.`);
                }

                // Currency Converter
                if (e.target.id === 'convert-currency-btn') {
                    handleCurrencyConversion();
                }
            });

            // Form Submissions
            document.body.addEventListener('submit', async (e) => {
                e.preventDefault();

                // Login
                if (e.target.id === 'login-form') {
                    appState.isLoading = true;
                    renderApp();
                    const email = e.target.email.value;
                    const password = e.target.password.value;
                    try {
                        await signInWithEmailAndPassword(auth, email, password);
                        // onAuthStateChanged will handle navigation
                    } catch (error) {
                        renderModal("Login Failed", error.message);
                    }
                    appState.isLoading = false;
                    renderApp();
                }

                // Registration
                if (e.target.id === 'registration-form-final') {
                    await handleRegistrationSubmit(e.target);
                }

                // AI Chat
                if (e.target.id === 'gemini-chat-form') {
                    const input = e.target.prompt;
                    const prompt = input.value.trim();
                    if (prompt) {
                        input.value = '';
                        appState.geminiChatHistory.push({ role: "user", parts: [{ text: prompt }] });
                        renderApp(); // Show user prompt immediately
                       
                        const { text, sources } = await getGeminiResponse(prompt);
                       
                        // Re-render to show model response
                        const chatBox = document.getElementById('chat-history');
                        chatBox.innerHTML += renderChatMessage('model', text, sources);
                        chatBox.scrollTop = chatBox.scrollHeight;
                    }
                }

                // Contact Form
                if (e.target.id === 'contact-form') {
                    renderModal("Message Sent", "Thank you for contacting us. We will get back to you shortly.");
                    e.target.reset();
                }
            });
        }

        // --- REGISTRATION LOGIC ---
        function handleRegistrationNext(nextStep) {
            // Save data from current step
            const form = document.getElementById(`step-${appState.currentRegistrationStep}-form`);
            if (form) {
                const formData = new FormData(form);
                formData.forEach((value, key) => {
                    appState.registrationData[key] = value;
                });
            }
            appState.currentRegistrationStep = parseInt(nextStep);
            renderApp();
        }
       
        function handleRegistrationPrev(prevStep) {
            appState.currentRegistrationStep = parseInt(prevStep);
            renderApp();
        }

        async function handleRegistrationSubmit(form) {
            appState.isLoading = true;
            renderApp();

            // Save final step data
            const formData = new FormData(form);
            formData.forEach((value, key) => {
                appState.registrationData[key] = value;
            });

            const { email, password, displayName, role, ...profileData } = appState.registrationData;

            try {
                // 1. Create user in Auth
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;

                // 2. Save profile data to Firestore
                const userDocRef = doc(db, `artifacts/${appId}/users/${user.uid}/profile`, "data");
                const fullProfile = {
                    uid: user.uid,
                    email: email,
                    displayName: displayName || email.split('@')[0],
                    role: role || 'user', // Default role
                    ...profileData,
                    createdAt: new Date().toISOString()
                };
               
                await setDoc(userDocRef, fullProfile);

                // Add to public applicants list if job role is selected
                if (role && role !== 'user' && role !== 'founder') {
                    const applicantsColRef = collection(db, `artifacts/${appId}/public/data/applicants`);
                    await addDoc(applicantsColRef, {
                        uid: user.uid,
                        displayName: displayName,
                        email: email,
                        role: role,
                        status: 'Pending Review',
                        appliedAt: new Date().toISOString()
                    });
                }
               
                // onAuthStateChanged will catch the new user and navigate to dashboard
                console.log("User registered successfully");
                appState.registrationData = {};
                appState.currentRegistrationStep = 1;

            } catch (error) {
                console.error("Registration failed:", error);
                renderModal("Registration Failed", error.message);
                appState.isLoading = false;
                renderApp();
            }
        }

        // --- OTHER HANDLERS ---
       
        // Currency Conversion Handler
        async function handleCurrencyConversion() {
            const amount = document.getElementById('currency-amount').value;
            const from = document.getElementById('currency-from').value;
            const to = document.getElementById('currency-to').value;
            const resultEl = document.getElementById('currency-result');

            if (!amount || amount <= 0) {
                resultEl.textContent = "Please enter a valid amount.";
                return;
            }

            resultEl.textContent = "Converting...";
            appState.isLoading = true;
            renderApp(); // Show loader

            // Mock CHC (ChitraHarsha Cryptocurrency) conversion
            const chcToUsdRate = 500; // 1 CHC = 500 USD (Mock)
            const usdToInrRate = 83.5; // 1 USD = 83.5 INR (Approx Mock)

            try {
                let resultRate;
                if (from === to) {
                    resultRate = 1;
                } else if (from === 'CHC' && to === 'USD') {
                    resultRate = chcToUsdRate;
                } else if (from === 'USD' && to === 'CHC') {
                    resultRate = 1 / chcToUsdRate;
                } else if (from === 'CHC' && to === 'INR') {
                    resultRate = chcToUsdRate * usdToInrRate;
                } else if (from === 'INR' && to === 'CHC') {
                    resultRate = 1 / (chcToUsdRate * usdToInrRate);
                } else if (from === 'CHC') { // CHC to other fiat
                    // Use a public API for real rates
                    const usdConversion = await fetch(`https://api.frankfurter.app/latest?from=USD&to=${to}`);
                    if (!usdConversion.ok) throw new Error("API failed to get USD rate");
                    const data = await usdConversion.json();
                    resultRate = chcToUsdRate * data.rates[to];
                } else if (to === 'CHC') { // Other fiat to CHC
                    // Use a public API for real rates
                    const fiatToUsd = await fetch(`https://api.frankfurter.app/latest?from=${from}&to=USD`);
                    if (!fiatToUsd.ok) throw new Error("API failed to get USD rate");
                    const data = await fiatToUsd.json();
                    resultRate = (1 / chcToUsdRate) * data.rates.USD;
                } else {
                    // Standard Fiat-to-Fiat
                    const response = await fetch(`https://api.frankfurter.app/latest?amount=${amount}&from=${from}&to=${to}`);
                    if (!response.ok) throw new Error("Currency API failed.");
                    const data = await response.json();
                    resultRate = data.rates[to];
                   
                    appState.isLoading = false;
                    renderApp(); // Hide loader
                    document.getElementById('currency-result').textContent = `${new Intl.NumberFormat('en-IN', { style: 'currency', currency: to }).format(resultRate)}`;
                    return;
                }
               
                const finalResult = amount * resultRate;
                const formatter = (to === 'CHC')
                    ? new Intl.NumberFormat('en-IN', { maximumFractionDigits: 6 })
                    : new Intl.NumberFormat('en-IN', { style: 'currency', currency: to, maximumFractionDigits: 2 });
               
                appState.isLoading = false;
                renderApp(); // Hide loader
                document.getElementById('currency-result').textContent = `${(to === 'CHC') ? finalResult.toFixed(6) + ' CHC' : formatter.format(finalResult)}`;

            } catch (error) {
                console.error("Currency conversion error:", error);
                appState.isLoading = false;
                renderApp(); // Hide loader
                document.getElementById('currency-result').textContent = "Conversion failed. Try again.";
            }
        }

            }

                    <p>Select your operating system to begin the download. Our secure client provides full access to the Navasrijan platform.</p>
                    <button class="w-full text-left p-4 rounded-lg bg-brand-light hover:bg-brand-mid transition-all flex items-center space-x-3">
                        ${lucide.icons.Laptop.toSvg({ class: 'w-6 h-6 text-brand-accent' })}
                        <span>Download for <strong>Windows</strong></span>
                    </button>
                    <button class="w-full text-left p-4 rounded-lg bg-brand-light hover:bg-brand-mid transition-all flex items-center space-x-3">
                        ${lucide.icons.Apple.toSvg({ class: 'w-6 h-6 text-white' })}
                        <span>Download for <strong>macOS</strong></span>
                    </button>
                    <button class="w-full text-left p-4 rounded-lg bg-brand-light hover:bg-brand-mid transition-all flex items-center space-x-3">

        function handleSelectPlan(plan) {
            const content = `

                    <p class="text-lg">You have selected the <strong>${plan} Plan</strong>.</p>
                    <p>Please choose your preferred payment method. All transactions are secured with quantum-level encryption and blockchain verification.</p>
                   
                    <div class="border border-brand-light rounded-lg p-4">

                        <button class="w-full p-3 rounded-lg bg-blue-500 hover:bg-blue-600 text-white transition-all flex items-center justify-center space-x-2 font-medium">
                            ${lucide.icons.IndianRupee.toSvg({ class: 'w-5 h-5' })}
                            <span>Pay with <strong>ChitraHarsha VPK Pay</strong></span>
                        </button>
                       
                        <div class="flex items-center text-gray-400 my-4">
                            <span class="flex-grow border-t border-gray-600"></span>
                            <span class="px-3">OR</span>
                            <span class="flex-grow border-t border-gray-600"></span>
                        </div>
                       
                        <button class="w-full p-3 rounded-lg bg-yellow-500 hover:bg-yellow-600 text-black transition-all flex items-center justify-center space-x-2 font-medium">
                            ${lucide.icons.Bitcoin.toSvg({ class: 'w-5 h-5' })}
                            <span>Pay with Crypto (<strong>CHC</strong>/BTC/ETH)</span>
                        </button>

        // --- RENDER FUNCTIONS ---
        function renderApp() {
            const appContainer = document.getElementById('app');
            if (!appContainer) return;

            let content = '';
            switch (appState.currentPage) {
                case 'home':
                    content = renderHomePage();
                    break;
                case 'login':
                    content = renderLoginPage();
                    break;
                case 'register':
                    content = renderRegisterPage();
                    break;
                case 'dashboard':
                    content = renderDashboardPage();
                    break;
                case 'about':
                    content = renderAboutPage();
                    break;
                case 'blogs':
                    content = renderBlogsPage();
                    break;
                case 'contact':
                    content = renderContactPage();
                    break;
                case 'faq':
                    content = renderFAQPage();
                    break;
                case 'policy':
                    content = renderPolicyPage();
                    break;
                case 'terms':
                    content = renderTermsPage();
                    break;
                default:
                    content = renderHomePage();
            }

            appContainer.innerHTML = `
                ${renderHeader()}
                <main class="min-h-screen pt-20">
                    ${content}
                </main>
                ${renderFooter()}
                ${appState.isLoading ? renderLoader() : ''}
            `;

            // Initialize icons
            lucide.createIcons();
        }

            const isLoggedIn = appState.user && appState.user.role !== 'guest';

                        <div class="hidden md:flex items-center space-x-6">
                            <a href="#" data-nav="home" class="text-gray-300 hover:text-brand-accent transition-colors">Home</a>

                            ${isLoggedIn ? `

                                <button data-nav="login" class="px-4 py-2 rounded-md text-gray-300 hover:text-white hover:bg-brand-light transition-all">

        function renderFooter() {
            return `
                <footer class="bg-brand-dark border-t border-brand-light/50 text-gray-400">
