    <script type="module">
      // Import Firebase services
      import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
      import {
        getAuth,
        signInAnonymously,
        signInWithCustomToken,
        onAuthStateChanged,
        createUserWithEmailAndPassword,
        signInWithEmailAndPassword,
        signOut,
      } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
      import {
        getFirestore,
        doc,
        getDoc,
        setDoc,
        collection,
        addDoc,
        setLogLevel,
      } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

      // --- GLOBAL APP STATE ---
      const appState = {
        currentPage: "home",
        user: null,
        authReady: false,
        isLoading: false, // General page loader
        isModelTyping: false, // For chat "typing" indicator
        geminiChatHistory: [],
        currentRegistrationStep: 1,
        registrationData: {},
        currencyConversion: {
          from: "USD",
          to: "INR",
          amount: 1,
          result: "...",
        },
        isMobileMenuOpen: false,
        isRecording: false,
        isTTSEnabled: true, // TTS is on by default
        translationLanguage: "hi", // Default translation lang (Hindi)
        speechRecognition: null,
      };

      // --- FIREBASE & APP CONFIG ---
      let app, auth, db;
      const appId =
        typeof __app_id !== "undefined" ? __app_id : "default-app-id";

      // Use provided Firebase config
      try {
        const firebaseConfig = JSON.parse(
          typeof __firebase_config !== "undefined" ? __firebase_config : "{}"
        );
        app = initializeApp(firebaseConfig);
        auth = getAuth(app);
        db = getFirestore(app);
        setLogLevel("Debug");
      } catch (error) {
        console.error("Firebase initialization error:", error);
        renderModal(
          "Initialization Error",
          "Could not connect to services. Please refresh."
        );
      }

      // --- AUTHENTICATION ---
      onAuthStateChanged(auth, async (user) => {
        if (user) {
          appState.user = user;
          // Fetch user profile from Firestore
          const userProfile = await getUserProfile(user.uid);
          appState.user = { ...user, ...userProfile };

          // Navigate to dashboard after login/registration
          if (
            appState.currentPage === "login" ||
            appState.currentPage === "register"
          ) {
            appState.currentPage = "dashboard";
          }
        } else {
          appState.user = null;
          // Try custom token or anonymous sign-in
          try {
            if (
              typeof __initial_auth_token !== "undefined" &&
              __initial_auth_token
            ) {
              await signInWithCustomToken(auth, __initial_auth_token);
            } else {
              await signInAnonymously(auth);
              console.log("Signed in anonymously");
            }
          } catch (error) {
            console.error("Auth error:", error);
          }
        }
        appState.authReady = true;
        renderApp();
      });

      async function handleLogout() {
        try {
          await signOut(auth);
          appState.user = null;
          navigateTo("home");
        } catch (error) {
          console.error("Logout failed:", error);
          renderModal(
            "Logout Error",
            "Could not log you out. Please try again."
          );
        }
      }

      async function getUserProfile(userId) {
        try {
          // Private user data path
          const userDocRef = doc(
            db,
            `artifacts/${appId}/users/${userId}/profile`,
            "data"
          );
          const docSnap = await getDoc(userDocRef);
          if (docSnap.exists()) {
            return docSnap.data();
          } else {
            console.log("No user profile found, creating one...");
            // Create a default profile if none exists (e.g., for anonymous user)
            const defaultProfile = {
              role: "guest",
              displayName: "Guest User",
            };
            await setDoc(userDocRef, defaultProfile);
            return defaultProfile;
          }
        } catch (error) {
          console.error("Error getting user profile:", error);
          return { role: "guest", displayName: "Guest" };
        }
      }

      // --- STYLES & CONFIG ---
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ["Inter", "sans-serif"],
            },
            colors: {
              "brand-dark": "#0a092d",
              "brand-mid": "#1a184a",
              "brand-light": "#2b296b",
              "brand-accent": "#00ffff", // Cyan
              "brand-glow": "#f000ff", // Magenta
            },
            boxShadow: {
              "glow-cyan":
                "0 0 15px 0 rgba(0, 255, 255, 0.5), 0 0 5px 0 rgba(0, 255, 255, 0.7)",
              "glow-magenta":
                "0 0 15px 0 rgba(240, 0, 255, 0.5), 0 0 5px 0 rgba(240, 0, 255, 0.7)",
              "glow-cyan-lg":
                "0 0 25px 3px rgba(0, 255, 255, 0.7), 0 0 10px 1px rgba(0, 255, 255, 0.8)",
              "glow-magenta-lg":
                "0 0 25px 3px rgba(240, 0, 255, 0.7), 0 0 10px 1px rgba(240, 0, 255, 0.8)",
            },
            animation: {

              "pulse-glow-magenta":
                "pulse-glow-magenta 2.5s cubic-bezier(0.4, 0, 0.6, 1) infinite",
              "pulse-glow-red":
                "pulse-glow-red 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite",
              "subtle-gradient": "subtle-gradient 15s ease infinite",
              "typing-dots": "typing-dots 1s infinite steps(3, end)",
            },
            keyframes: {
              "pulse-glow-cyan": {
                "0%, 100%": {
                  opacity: 1,
                  boxShadow: "0 0 15px 0 rgba(0, 255, 255, 0.5)",
                },
                "50%": {
                  opacity: 0.8,
                  boxShadow: "0 0 25px 3px rgba(0, 255, 255, 0.7)",
                },
              },
              "pulse-glow-magenta": {
                "0%, 100%": {
                  opacity: 1,
                  boxShadow: "0 0 15px 0 rgba(240, 0, 255, 0.5)",
                },
                "50%": {
                  opacity: 0.8,
                  boxShadow: "0 0 25px 3px rgba(240, 0, 255, 0.7)",
                },
              },
              "pulse-glow-red": {
                "0%, 100%": {
                  opacity: 1,
                  boxShadow: "0 0 15px 0 rgba(239, 68, 68, 0.6)",
                },
                "50%": {
                  opacity: 0.7,
                  boxShadow: "0 0 25px 3px rgba(239, 68, 68, 0.8)",

              },
              "subtle-gradient": {
                "0%, 100%": { backgroundPosition: "0% 50%" },
                "50%": { backgroundPosition: "100% 50%" },
              },
              "typing-dots": {
                "0%": { content: '"."' },
                "33%": { content: '".."' },
                "66%": { content: '"..."' },
                "100%": { content: '"."' },
              },
            },
            typography: ({ theme }) => ({
              invert: {
                css: {
                  p: { marginBottom: theme("spacing.6") },
                  "ul, ol": { marginBottom: theme("spacing.6") },
                  "h1, h2, h3, h4, h5, h6": {
                    marginBottom: theme("spacing.4"),
                    marginTop: theme("spacing.8"),
                  },
                },
              },
            }),
          },
        },
        plugins: [tailwind.plugins.typography],
      };

      // --- SPEECH-TO-TEXT (STT) & TEXT-TO-SPEECH (TTS) ---

      // 1. STT: Initialize Speech Recognition
      function initializeSpeechRecognition() {
        window.SpeechRecognition =
          window.SpeechRecognition || window.webkitSpeechRecognition;
        if (window.SpeechRecognition) {
          appState.speechRecognition = new SpeechRecognition();
          appState.speechRecognition.continuous = false;
          appState.speechRecognition.lang = "en-IN"; // Set to Indian English
          appState.speechRecognition.interimResults = false;
          appState.speechRecognition.maxAlternatives = 1;

          appState.speechRecognition.onresult = (event) => {
            const transcript = event.results[0][0].transcript.trim();
            console.log("Transcript:", transcript);
            document.getElementById("prompt").value = transcript;
            stopRecording(); // Stop after getting a result
            // Automatically submit the transcript
            document.getElementById("gemini-chat-form").requestSubmit();
          };

          appState.speechRecognition.onerror = (event) => {
            console.error("Speech recognition error:", event.error);
            if (event.error === "no-speech") {
              renderModal(
                "No Speech",
                "I didn't hear anything. Please try again."
              );
            } else if (event.error === "not-allowed") {
              renderModal(
                "Permission Denied",
                "Please allow microphone access to use this feature."
              );
            }
            stopRecording();
          };

          appState.speechRecognition.onend = () => {
            if (appState.isRecording) {
              stopRecording(); // Ensure UI updates if speech ends
            }
          };
        } else {
          console.warn("Speech Recognition not supported in this browser.");
        }
      }

      // 2. STT: Control Functions
      function startRecording() {
        if (!appState.speechRecognition) {
          renderModal(
            "Not Supported",
            "Speech recognition is not supported in your browser."
          );
          return;
        }
        try {
          appState.speechRecognition.start();
          appState.isRecording = true;
          updateChatUI();
        } catch (e) {
          console.error("Recording start error:", e);
          if (e.name === "NotAllowedError") {
            renderModal(
              "Permission Denied",
              "Please allow microphone access in your browser settings."
            );
          } else {
            renderModal(
              "Error",
              "Could not start recording. Please try again."
            );
          }
          stopRecording();
        }
      }

      function stopRecording() {
        if (appState.speechRecognition) {
          appState.speechRecognition.stop();
        }
        appState.isRecording = false;
        updateChatUI();
      }

      function toggleRecording() {
        if (appState.isRecording) {
          stopRecording();
        } else {
          startRecording();
        }
      }

      // 3. TTS: API Call
      async function callGeminiTTS(textToSpeak) {
        console.log("Requesting TTS for:", textToSpeak);
        const apiKey = ""; // Handled by environment
        const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-tts:generateContent?key=${apiKey}`;

        // Control speech style for an Indian assistant persona
        const payload = {
          contents: [
            {
              parts: [
                {
                  text: `Speak in a helpful, professional, and clear tone with an Indian accent: ${textToSpeak}`,
                },
              ],
            },
          ],
          generationConfig: {
            responseModalities: ["AUDIO"],
            speechConfig: {
              voiceConfig: {
                prebuiltVoiceConfig: { voiceName: "Schedar" }, // A clear, even voice
              },
            },
          },
          model: "gemini-2.5-flash-preview-tts",
        };

        try {
          const response = await fetch(apiUrl, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
          });
          if (!response.ok)
            throw new Error(`TTS API Error: ${response.statusText}`);

          const result = await response.json();
          const part = result?.candidates?.[0]?.content?.parts?.[0];
          const audioData = part?.inlineData?.data;
          const mimeType = part?.inlineData?.mimeType;

          if (audioData && mimeType && mimeType.startsWith("audio/")) {
            playAudio(audioData, mimeType);
          } else {
            throw new Error("Invalid TTS response structure.");
          }
        } catch (error) {
          console.error("Gemini TTS call failed:", error);
          renderModal(
            "TTS Error",
            "Could not generate speech for the response."
          );
        }
      }

      // 4. TTS: Audio Playback Helpers
      function base64ToArrayBuffer(base64) {
        const binaryString = window.atob(base64);
        const len = binaryString.length;
        const bytes = new Uint8Array(len);
        for (let i = 0; i < len; i++) {
          bytes[i] = binaryString.charCodeAt(i);
        }
        return bytes.buffer;
      }

      function pcmToWav(pcmData, sampleRate) {
        const numChannels = 1;
        const bitsPerSample = 16;
        const byteRate = sampleRate * numChannels * (bitsPerSample / 8);
        const blockAlign = numChannels * (bitsPerSample / 8);
        const dataSize = pcmData.length * (bitsPerSample / 8);
        const buffer = new ArrayBuffer(44 + dataSize);
        const view = new DataView(buffer);

        // RIFF header
        writeString(view, 0, "RIFF");
        view.setUint32(4, 36 + dataSize, true);
        writeString(view, 8, "WAVE");
        // fmt chunk
        writeString(view, 12, "fmt ");
        view.setUint32(16, 16, true);
        view.setUint16(20, 1, true); // Audio format (1 = PCM)
        view.setUint16(22, numChannels, true);
        view.setUint32(24, sampleRate, true);
        view.setUint32(28, byteRate, true);
        view.setUint16(32, blockAlign, true);
        view.setUint16(34, bitsPerSample, true);
        // data chunk
        writeString(view, 36, "data");
        view.setUint32(40, dataSize, true);

        // Write PCM data
        let offset = 44;
        for (let i = 0; i < pcmData.length; i++, offset += 2) {
          view.setInt16(offset, pcmData[i], true);
        }
        return new Blob([view], { type: "audio/wav" });
      }

      function writeString(view, offset, string) {
        for (let i = 0; i < string.length; i++) {
          view.setUint8(offset + i, string.charCodeAt(i));
        }
      }

      function playAudio(base64Data, mimeType) {
        try {
          const sampleRateMatch = mimeType.match(/rate=(\d+)/);
          if (!sampleRateMatch)
            throw new Error("Sample rate not found in mimeType");

          const sampleRate = parseInt(sampleRateMatch[1], 10);
          const pcmData = base64ToArrayBuffer(base64Data);
          const pcm16 = new Int16Array(pcmData);
          const wavBlob = pcmToWav(pcm16, sampleRate);
          const audioUrl = URL.createObjectURL(wavBlob);

          const audio = new Audio(audioUrl);
          audio.play();
          audio.onended = () => URL.revokeObjectURL(audioUrl);
        } catch (error) {
          console.error("Error playing audio:", error);
          renderModal("Audio Error", "Failed to play the audio response.");
        }
      }

      // --- GEMINI API CALL (TEXT & TRANSLATION) ---
      async function callGeminiAPI(payload) {
        const apiKey = ""; // API key is handled by the environment
        const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;

        try {
          const response = await fetch(apiUrl, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
          });

          if (!response.ok) {
            throw new Error(`API Error: ${response.statusText}`);
          }

          const result = await response.json();
          const candidate = result.candidates?.[0];

          if (candidate && candidate.content?.parts?.[0]?.text) {
            const text = candidate.content.parts[0].text;
            const groundingMetadata = candidate.groundingMetadata;
            let sources = [];
            if (groundingMetadata && groundingMetadata.groundingAttributions) {
              sources = groundingMetadata.groundingAttributions
                .map((attr) => ({
                  uri: attr.web?.uri,
                  title: attr.web?.title,
                }))
                .filter((s) => s.uri && s.title);
            }
            return { text, sources };
          } else {
            throw new Error("Invalid response structure from API.");
          }
        } catch (error) {
          console.error("Gemini API call failed:", error);
          return {
            text: "My apologies, I'm encountering a technical issue. Please try again in a moment.",
            sources: [],
          };
        }
      }

      // Main function for chat responses
      async function getGeminiResponse(prompt) {
        appState.isModelTyping = true;
        renderApp(); // Show typing indicator

        // System prompt reinforcing Indian context and compliance
        const systemPrompt =
          "You are SarvangaNavasrijan AI, an expert assistant for 'The ChitraHarsha SarvangaNavasrijan', an all-rounder creation platform. Your purpose is to help users with brainstorming, research, and development of new creations. You must adhere to Indian government rules and regulations (like the IT Act and DPDP Act) and promote 'Made in India' innovations. Provide concise, helpful, and grounded information.";

        const payload = {
          contents: [
            ...appState.geminiChatHistory, // Include past conversation
            { role: "user", parts: [{ text: prompt }] },
          ],
          systemInstruction: { parts: [{ text: systemPrompt }] },
          tools: [{ google_search: {} }], // Enable Google Search grounding
        };

        const { text, sources } = await callGeminiAPI(payload);

        // Add model response to history
        appState.geminiChatHistory.push({
          role: "model",
          parts: [{ text, sources }],
        }); // Store sources in history

        // Trigger TTS if enabled
        if (appState.isTTSEnabled) {
          await callGeminiTTS(text);
        }

        appState.isModelTyping = false;
        renderApp(); // Re-render with new message
      }

      // Function for inline translation
      async function getTranslation(text, langCode, targetElement) {
        const langMap = {
          hi: "Hindi",
          ta: "Tamil",
          te: "Telugu",
          en: "English",
          bn: "Bengali",
          mr: "Marathi",
        };
        const langName = langMap[langCode] || "the selected language";

        targetElement.innerHTML = `<span class="text-xs text-gray-400 italic">Translating to ${langName}...</span>`;

        const systemPrompt = `You are an expert translator. Translate the following text into ${langName}. Provide only the translated text, with no preamble or explanation.`;

        const payload = {
          contents: [{ role: "user", parts: [{ text }] }],
          systemInstruction: { parts: [{ text: systemPrompt }] },
        };

        const { text: translatedText } = await callGeminiAPI(payload);

        targetElement.innerHTML = translatedText;
      }

      // --- NAVIGATION & ROUTING ---
      function navigateTo(page) {
        appState.currentPage = page;
        appState.geminiChatHistory = []; // Clear chat history on page change
        appState.currentRegistrationStep = 1; // Reset registration
        appState.registrationData = {};
        appState.isMobileMenuOpen = false; // Close mobile menu
        window.scrollTo(0, 0);
        renderApp();
      }

      // --- EVENT HANDLERS ---
      function attachGlobalListeners() {
        document.body.addEventListener("click", (e) => {
          // Navigation links
          const navLink = e.target.closest("[data-nav]");
          if (navLink) {
            e.preventDefault();
            navigateTo(navLink.dataset.nav);
          }

          // Mobile Menu Toggle
          const menuToggle = e.target.closest("[data-menu-toggle]");
          if (menuToggle) {
            appState.isMobileMenuOpen = !appState.isMobileMenuOpen;
            renderApp(); // Re-render to show/hide menu
          }

          // Modal close
          if (e.target.closest("[data-modal-close]")) {
            document.getElementById("modal-backdrop")?.remove();
          }

          // Guest Mode
          if (e.target.closest("[data-guest-mode]")) {
            appState.currentPage = "dashboard";
            renderApp();
          }

          // Registration
          const regNext = e.target.closest("[data-reg-next]");
          if (regNext) handleRegistrationNext(regNext.dataset.regNext);

          const regPrev = e.target.closest("[data-reg-prev]");
          if (regPrev) handleRegistrationPrev(regPrev.dataset.regPrev);

          // --- Dashboard Interactive Buttons ---

          // Hub Features
          const hubButton = e.target.closest("[data-nav-hub]");
          if (hubButton) {
            handleHubFeature(hubButton.dataset.navHub);
          }

          // Quick Actions
          const quickActionButton = e.target.closest("[data-quick-action]");
          if (quickActionButton) {
            handleQuickAction(quickActionButton.dataset.quickAction);
          }

          // Download Client
          const downloadButton = e.target.closest("[data-download]");
          if (downloadButton) {
            handleDownloadClient();
          }

          // Download OS Buttons (inside modal)
          const osButton = e.target.closest("[data-download-os]");
          if (osButton) {
            handleOSDownload(osButton.dataset.downloadOs);
          }

          // 3D Modeler Save Button
          const saveButton = e.target.closest("[data-save-to-cloud]");
          if (saveButton) {
            renderModal(
              "Save Successful",
              "Your project has been securely saved to your Indian Cloud Database storage.",
              "success"
            );
          }

          // HR/Placements
          const interviewButton = e.target.closest("[data-start-interview]");
          if (interviewButton) {
            handleStartInterview(interviewButton.dataset.startInterview);
          }

          // --- End Dashboard ---

          // Freemium/Pricing
          if (e.target.closest("[data-select-plan]")) {
            handleSelectPlan(
              e.target.closest("[data-select-plan]").dataset.selectPlan
            );
          }

          // Salary Automation
          if (e.target.closest("#salary-toggle")) {
            const toggle = e.target.closest("#salary-toggle");
            const enabled = toggle.getAttribute("aria-checked") === "true";
            toggle.setAttribute("aria-checked", !enabled);
            toggle.querySelector("span").classList.toggle("translate-x-5");
            toggle.classList.toggle("bg-brand-accent");
            toggle.classList.toggle("bg-gray-600");
            renderModal(
              "Salary Automation",
              `AI-driven salary payment has been ${
                !enabled ? "ENABLED" : "DISABLED"
              }.`
            );
          }

          // Currency Converter
          if (e.target.id === "convert-currency-btn") {
            handleCurrencyConversion();
          }

          // AI Chat Controls (TTS & STT)
          if (e.target.closest("#mic-button")) {
            toggleRecording();
          }
          if (e.target.closest("#tts-toggle-button")) {
            appState.isTTSEnabled = !appState.isTTSEnabled;
            updateChatUI();
          }

          // Logout
          if (e.target.closest("[data-logout]")) {
            handleLogout();
          }

          // Translate Button
          const translateBtn = e.target.closest("[data-translate]");
          if (translateBtn) {
            const bubble = translateBtn.closest(".chat-bubble-model");
            const originalText =
              bubble.querySelector(".original-text").innerText;
            const targetElement = bubble.querySelector(".translation-result");
            const langCode = appState.translationLanguage;
            getTranslation(originalText, langCode, targetElement);
            translateBtn.style.display = "none"; // Hide button after click
          }
        });

        // Handle language change
        document.body.addEventListener("change", (e) => {
          if (e.target.id === "translate-lang-select") {
            appState.translationLanguage = e.target.value;
            // Reset any existing translations
            document
              .querySelectorAll(".translation-result")
              .forEach((el) => (el.innerHTML = ""));
            // Show all translate buttons again
            document
              .querySelectorAll("[data-translate]")
              .forEach((btn) => (btn.style.display = "block"));
          }
        });

        // Form Submissions
        document.body.addEventListener("submit", async (e) => {
          e.preventDefault();

          // Login
          if (e.target.id === "login-form") {
            appState.isLoading = true;
            renderApp();
            const email = e.target.email.value;
            const password = e.target.password.value;
            try {
              await signInWithEmailAndPassword(auth, email, password);
              // onAuthStateChanged will handle navigation
            } catch (error) {
              renderModal("Login Failed", error.message);
            }
            appState.isLoading = false;
            renderApp();
          }

          // Registration
          if (e.target.id === "registration-form-final") {
            await handleRegistrationSubmit(e.target);
          }

          // AI Chat
          if (e.target.id === "gemini-chat-form") {
            const input = e.target.prompt;
            const prompt = input.value.trim();
            if (prompt) {
              input.value = "";
              // Add user prompt to history and render
              appState.geminiChatHistory.push({
                role: "user",
                parts: [{ text: prompt }],
              });
              // Call getGeminiResponse, which will set 'isModelTyping' and re-render
              getGeminiResponse(prompt);
            }
          }

          // Contact Form
          if (e.target.id === "contact-form") {
            renderModal(
              "Message Sent",
              "Thank you for contacting us. We will get back to you shortly."
            );
            e.target.reset();
          }

      // --- REGISTRATION LOGIC ---
      function handleRegistrationNext(nextStep) {
        // Save data from current step
        const form = document.getElementById(
          `step-${appState.currentRegistrationStep}-form`
        );
        if (form) {
          const formData = new FormData(form);
          formData.forEach((value, key) => {
            appState.registrationData[key] = value;
          });
        }
        appState.currentRegistrationStep = parseInt(nextStep);
        renderApp();
      }

      function handleRegistrationPrev(prevStep) {
        appState.currentRegistrationStep = parseInt(prevStep);
        renderApp();
      }

      async function handleRegistrationSubmit(form) {
        appState.isLoading = true;
        renderApp();

        // Save final step data
        const formData = new FormData(form);
        formData.forEach((value, key) => {
          appState.registrationData[key] = value;
        });

        const { email, password, displayName, role, ...profileData } =
          appState.registrationData;

        if (password !== appState.registrationData["confirm_password"]) {
          renderModal("Registration Failed", "Passwords do not match.");
          appState.isLoading = false;
          appState.currentRegistrationStep = 1; // Go back to password step
          renderApp();
          return;
        }

        try {
          // 1. Create user in Auth
          const userCredential = await createUserWithEmailAndPassword(
            auth,
            email,
            password
          );
          const user = userCredential.user;

          // 2. Save profile data to Firestore (Private Path)
          const userDocRef = doc(
            db,
            `artifacts/${appId}/users/${user.uid}/profile`,
            "data"
          );
          const fullProfile = {
            uid: user.uid,
            email: email,
            displayName: displayName || email.split("@")[0],
            role: role || "user", // Default role
            ...profileData,
            createdAt: new Date().toISOString(),
          };

          await setDoc(userDocRef, fullProfile);

          // Add to public applicants list if job role is selected (Public Path)
          if (role && role !== "user" && role !== "founder") {
            const applicantsColRef = collection(
              db,
              `artifacts/${appId}/public/data/applicants`
            );
            await addDoc(applicantsColRef, {
              uid: user.uid,
              displayName: displayName,
              email: email,
              role: role,
              status: "Pending Review",
              appliedAt: new Date().toISOString(),
            });
          }

          // onAuthStateChanged will catch the new user and navigate to dashboard
          console.log("User registered successfully");
          appState.registrationData = {};
          appState.currentRegistrationStep = 1;
        } catch (error) {
          console.error("Registration failed:", error);
          renderModal("Registration Failed", error.message);
          appState.isLoading = false;
          renderApp();
        }
      }

      /**
       * Renders a modal.
       * @param {string} title - The title of the modal.
       * @param {string} message - The HTML content of the modal.
       * @param {string} type - 'default', 'success', 'error', 'large'
       * @param {boolean} forceLarge - Overrides type to make modal large.
       */
      function renderModal(
        title,
        message,
        type = "default",
        forceLarge = false
      ) {
        // Remove existing modal first
        document.getElementById("modal-backdrop")?.remove();

        let borderColor = "border-brand-accent/50";
        let shadowColor = "shadow-glow-cyan";
        if (type === "success") {
          borderColor = "border-green-500/50";
          shadowColor = "shadow-green-500"; // You'd need to define this glow
        } else if (type === "error") {
          borderColor = "border-red-500/50";
          shadowColor = "shadow-red-500"; // You'd need to define this glow
        }
